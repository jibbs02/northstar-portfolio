[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-local"
version = "0.1.0"
description = "Private, self-hosted portfolio guidance for a single household."
requires-python = ">=3.12"
dependencies = [
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "PyJWT[crypto]==2.15.0",
  "python-multipart==0.0.32",
  "sqlcipher3-wheels==0.5.7",
  "starlette==1.4.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.12.0",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-cov==6.0.0",
  "ruff==0.11.2",
]

[tool.setuptools.packages.find]
include = ["northstar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]
