services:
  app:
    build:
      context: .
      args:
        NORTHSTAR_BUILD_COMMIT: ${NORTHSTAR_BUILD_COMMIT:?Set NORTHSTAR_BUILD_COMMIT to the reviewed commit}
    image: northstar-local:production
    pull_policy: never
    container_name: northstar-local
    env_file:
      - path: ${NORTHSTAR_SECRET_FILE:?Set NORTHSTAR_SECRET_FILE to the external secrets.env path}
        format: raw
    environment:
      NORTHSTAR_DATABASE_PATH: /data/northstar.db
      NORTHSTAR_BACKUP_DIR: /backups
      NORTHSTAR_SECRETS_PATH: /run/secrets/northstar.env
    ports:
      - "127.0.0.1:${NORTHSTAR_PORT:-8010}:8000"
    volumes:
      - ${NORTHSTAR_DATA_DIR:?Set NORTHSTAR_DATA_DIR to the external data directory}:/data
      - ${NORTHSTAR_BACKUP_DIR:?Set NORTHSTAR_BACKUP_DIR to the external backup directory}:/backups
      - ${NORTHSTAR_SECRET_FILE:?Set NORTHSTAR_SECRET_FILE to the external secrets.env path}:/run/secrets/northstar.env:ro
    read_only: true
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "1.00"
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
